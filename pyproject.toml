[project]
name = "tutelary"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

# Virtual workspace root: the umbrella package's dist name is `tutelary`
# (packages/runtime, M3) — the root must not claim it. See docs/plans §2.

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "pyright>=1.1.390",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# importlib 模式：各包 tests/ 无 __init__.py，M2 起多包同名测试文件不冲突；
# -p pytester：启用契约插件骨架的测试装置（packages/core/tests/test_contract.py）；
# -m 'not docker'：docker-marked 集成测试默认排除（AGENTS §4.7 独立车道），
#   需要时显式 -m docker 运行。
addopts = "--import-mode=importlib -p pytester -m 'not docker'"
testpaths = ["packages", "tests"]
markers = [
    "docker: 需要 Docker 守护进程的集成测试（默认排除，本机或 CI 按需 -m docker 开启）",
]

[tool.ruff]
target-version = "py313"
line-length = 100
# docs/ 是手写设计文档：ruff 0.16 会重排 markdown 里的 python 代码块，
# 造成基线文档的无谓 diff，显式排除。
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 把全角标点当"易混淆 Unicode"——中文注释与 docstring 是
# 项目规范（AGENTS §4.8/§4.10），这三条对本项目是纯噪声，有意关闭。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["tutelary"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["packages", "tests", "examples"]
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["packages"]
