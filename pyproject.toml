[project]
name = "tutelary"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

# Virtual workspace root: the umbrella package's dist name is `tutelary`
# (packages/runtime, M3) — the root must not claim it. See docs/plans §2.

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "pyright>=1.1.390",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# importlib 模式：各包 tests/ 无 __init__.py，M2 起多包同名测试文件不冲突
addopts = "--import-mode=importlib"
testpaths = ["packages", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["tutelary"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["packages", "tests", "examples"]
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["packages"]
