[project]
name = "tutelary-memory"
version = "0.1.0"
description = "Tutelary memory: markdown-backed Memory port implementation with event-driven write path."
requires-python = ">=3.13"
dependencies = ["tutelary-core==0.1.0"]

[project.entry-points."tutelary.contract_suites"]
memory = "tutelary.memory.contract"

[tool.uv.sources]
tutelary-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutelary"]
