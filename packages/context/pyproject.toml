[project]
name = "tutelary-context"
version = "0.1.0"
description = "Tutelary flagship: context governance - budget declaration, compaction, offloading, token introspection."
requires-python = ">=3.13"
dependencies = ["tutelary-core==0.1.0"]

[project.entry-points."tutelary.contract_suites"]
context = "tutelary.context.contract"

[tool.uv.sources]
tutelary-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutelary"]
