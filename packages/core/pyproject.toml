[project]
name = "tutelary-core"
version = "0.1.0"
description = "Tutelary contract kernel: vocabulary, events and bus, five ports, lifecycle and assembler."
requires-python = ">=3.13"
license = { text = "Apache-2.0" }

dependencies = []

[project.urls]
Repository = "https://github.com/Ember452/tutelary"

[project.optional-dependencies]
contract = ["pytest>=8"]

[project.entry-points.pytest11]
tutelary-contract = "tutelary.core.contract"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutelary"]
