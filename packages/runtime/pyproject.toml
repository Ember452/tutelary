[project]
name = "tutelary"
version = "0.1.0"
description = "Tutelary umbrella: the Agent facade, preset assembly and built-in tools - the sole composition root."
requires-python = ">=3.13"
dependencies = [
    "tutelary-core==0.1.0",
    "tutelary-context==0.1.0",
    "tutelary-engine==0.1.0",
    "tutelary-memory==0.1.0",
    "tutelary-policy==0.1.0",
    "tutelary-providers==0.1.0",
    "tutelary-sandbox==0.1.0",
]

[tool.uv.sources]
tutelary-core = { workspace = true }
tutelary-context = { workspace = true }
tutelary-engine = { workspace = true }
tutelary-memory = { workspace = true }
tutelary-policy = { workspace = true }
tutelary-providers = { workspace = true }
tutelary-sandbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutelary"]
