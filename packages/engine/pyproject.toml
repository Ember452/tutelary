[project]
name = "tutelary-engine"
version = "0.1.0"
description = "Tutelary engine: the event-sourced agent loop consuming Provider, Tool, Policy and Memory ports."
requires-python = ">=3.13"
license = { text = "Apache-2.0" }

dependencies = ["tutelary-core==0.1.0"]

[project.urls]
Repository = "https://github.com/Ember452/tutelary"

[tool.uv.sources]
tutelary-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutelary"]
