[project]
name = "tutelary-mem0-adapter"
version = "0.1.0"
description = "Official Mem0 adapter for the Tutelary Memory port - third-party-posture reference integration."
requires-python = ">=3.13"
dependencies = ["tutelary-core==0.1.0"]

[project.optional-dependencies]
mem0 = ["mem0ai>=0.1"]

[tool.uv.sources]
tutelary-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutelary_mem0_adapter"]
