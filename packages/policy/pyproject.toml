[project]
name = "tutelary-policy"
version = "0.1.0"
description = "Tutelary policy: composable permission policies with the Suspend approval decision."
requires-python = ">=3.13"
dependencies = ["tutelary-core==0.1.0"]

[tool.uv.sources]
tutelary-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutelary"]
